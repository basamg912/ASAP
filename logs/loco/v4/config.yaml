seed: 0
codebase_version: 1.0
headless: true
num_envs: 4096
auto_load_latest: false
checkpoint: null
project_name: G1_hist_ablation
experiment_name: hist_v4
base_dir: logs
timestamp: ${now:%Y%m%d_%H%M%S}
experiment_dir: ${base_dir}/${project_name}/${timestamp}-${experiment_name}-${log_task_name}-${robot.asset.robot_type}
save_dir: ${experiment_dir}/.hydra
force_flat_terrain: false
use_wandb: true
log_task_name: locomotion_hist_v4
sim_type: isaacgym
env_spacing: 20
output_dir: ${experiment_dir}/output
eval_overrides:
  headless: false
  num_envs: 1
  auto_load_latest: false
  use_wandb: false
  env:
    config:
      max_episode_length_s: 100000
algo:
  _target_: humanoidverse.agents.ppo_hist_v4.ppo_hist_v4.PPOHistV4
  _recursive_: false
  config:
    num_learning_epochs: 5
    num_mini_batches: 4
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    value_loss_coef: 1.0
    entropy_coef: 0.01
    actor_learning_rate: 0.001
    critic_learning_rate: 0.001
    max_grad_norm: 1.0
    use_clipped_value_loss: true
    schedule: adaptive
    desired_kl: 0.01
    num_steps_per_env: 24
    save_interval: 100
    load_optimizer: true
    init_noise_std: 0.8
    num_learning_iterations: 30000
    init_at_random_ep_len: true
    eval_callbacks: null
    latent_dim: 16
    vel_dim: 3
    vel_coef: 1.0
    latent_coef: 0.5
    latent_coef_warmup_iters: 500
    detach_encoder_for_policy: true
    encoder_obs_key: encoder_obs
    teacher_obs_key: teacher_obs
    recon_target_key: teacher_obs
    encoder_config:
      input_key: encoder_obs
      hidden_dims:
      - 256
      - 128
      channel_hidden_dims:
      - 64
      activation: ELU
    teacher_mode: critic
    teacher_config:
      enc_hidden_dims:
      - 128
      - 64
      activation: ELU
      output_norm: true
      learning_rate: 0.001
      value_hidden_dims:
      - 256
      - 128
      value_coef: 1.0
      align_coef: 1.0
      var_coef: 1.0
      cov_coef: 0.04
    module_dict:
      actor:
        input_dim:
        - actor_obs
        - 19
        output_dim:
        - robot_action_dim
        layer_config:
          type: MLP
          hidden_dims:
          - 512
          - 256
          - 128
          activation: ELU
      critic:
        type: MLP
        input_dim:
        - critic_obs
        output_dim:
        - 1
        layer_config:
          type: MLP
          hidden_dims:
          - 512
          - 256
          - 128
          activation: ELU
env:
  _target_: humanoidverse.envs.locomotion.locomotion_cmd_curriculum.LeggedRobotLocomotionCmdCurriculum
  _recursive_: false
  config:
    experiment_name: ${experiment_name}
    num_envs: ${num_envs}
    headless: ${headless}
    simulator: ${simulator}
    save_rendering_dir: null
    ckpt_dir: null
    robot: ${robot}
    domain_rand: ${domain_rand}
    rewards: ${rewards}
    terrain: ${terrain}
    obs: ${obs}
    env_spacing: 5.0
    max_episode_length_s: 20
    normalization:
      clip_actions: 100.0
      clip_observations: 100.0
    termination:
      terminate_when_close_to_dof_pos_limit: false
      terminate_when_close_to_dof_vel_limit: false
      terminate_when_close_to_torque_limit: false
      terminate_by_contact: false
      terminate_by_gravity: true
      terminate_by_low_height: true
    termination_scales:
      termination_close_to_dof_pos_limit: 0.98
      termination_close_to_dof_vel_limit: 0.98
      termination_close_to_torque_limit: 0.98
      termination_min_base_height: 0.1
      termination_gravity_x: 0.8
      termination_gravity_y: 0.8
      termination_orientation_limit: 0.8
    locomotion_obs_scales:
      lin_vel: 1.0
      ang_vel: 1.0
      dof_pos: 1.0
      dof_vel: 1.0
      humanoid_commands_scale: 1.0
    locomotion_command_ranges:
      lin_vel_x:
      - -0.5
      - 1.0
      lin_vel_y:
      - -0.3
      - 0.3
      ang_vel_yaw:
      - -0.2
      - 0.2
    locomotion_command_resampling_time: 10.0
    locomotion_stand_still_prob: 0.1
    command_curriculum:
      enabled: true
      reward_term_name: tracking_lin_vel
      tracking_reward_threshold: 0.8
      range_step: 0.1
      update_interval_steps: null
      tracking_error_ema_alpha: 0.001
      initial_ranges:
        lin_vel_x:
        - -0.1
        - 0.1
        lin_vel_y:
        - -0.1
        - 0.1
        ang_vel_yaw:
        - -0.1
        - 0.1
