# @package _global_

defaults:
  - locomotion

# locomotion + command range curriculum (average_episode_length 기반, additive env)
# 사용: train_agent.py ... env=locomotion_cmd_curriculum
env:
  _target_: humanoidverse.envs.locomotion.locomotion_cmd_curriculum.LeggedRobotLocomotionCmdCurriculum
  config:
    command_curriculum:
      enabled: True
      # progress 는 reset 이 발생한 스텝마다 degree 만큼 증감, [0,1] 클립.
      # 4096 envs 에선 거의 매 스텝 reset 이 있어 ~24 call/iter → 0.00002 면 건강한 학습 기준 ~2k iter 에 full range
      degree: 0.00002
      level_down_threshold: 200  # average_episode_length(step) 이 이보다 작으면 축소
      # 초기 작은 command에서는 정지와 추종 정책의 reward 차이가 작다.
      # EPL이 충분히 높으면 progress 0.2까지만 먼저 확장하고,
      # 이후부터는 아래 XY tracking error gate로만 확장한다.
      bootstrap_level_up_epl: 600
      bootstrap_until_progress: 0.2
      # level-up 게이트: episode 동안의 ||command_xy - base_lin_vel_xy|| L2 평균.
      # vx/vy를 함께 평가하며, 0.06 m/s 미만일 때만 command range를 확장한다.
      tracking_error_level_up_threshold: 0.06
      tracking_error_ema_alpha: 0.001  # reset 당 EMA 계수 (~24 call/iter → 시정수 ≈ 40 iter)
      initial_progress: 0.0      # resume 시 진행도를 이어서 시작할 때 지정
      initial_ranges:            # progress=0 범위; 최종 범위는 locomotion_command_ranges
        lin_vel_x: [-0.1, 0.1]
        lin_vel_y: [-0.1, 0.1]
        ang_vel_yaw: [-0.1, 0.1]
        # heading 은 명시하지 않으면 처음부터 최종 범위 사용
