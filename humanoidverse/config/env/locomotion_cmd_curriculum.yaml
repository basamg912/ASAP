# @package _global_

defaults:
  - locomotion

# locomotion + Unitree-style linear velocity command curriculum
# 사용: train_agent.py ... env=locomotion_cmd_curriculum
env:
  _target_: humanoidverse.envs.locomotion.locomotion_cmd_curriculum.LeggedRobotLocomotionCmdCurriculum
  config:
    command_curriculum:
      enabled: True
      reward_term_name: tracking_lin_vel
      tracking_reward_threshold: 0.8
      range_step: 0.1
      # null이면 max_episode_length마다 평가한다.
      update_interval_steps: null
      # 아래 EMA는 curriculum gate가 아닌 x/y 오차 진단 로그에만 사용한다.
      tracking_error_ema_alpha: 0.001
      # x/y만 최종 locomotion_command_ranges까지 확장한다. yaw는 이 범위로 고정된다.
      initial_ranges:
        lin_vel_x: [-0.1, 0.1]
        lin_vel_y: [-0.1, 0.1]
        ang_vel_yaw: [-0.1, 0.1]
