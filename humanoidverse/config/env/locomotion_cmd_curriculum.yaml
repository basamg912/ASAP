# @package _global_

defaults:
  - locomotion

# locomotion + command range curriculum (average_episode_length 기반, additive env)
# 사용: train_agent.py ... env=locomotion_cmd_curriculum
env:
  _target_: humanoidverse.envs.locomotion.locomotion_cmd_curriculum.LeggedRobotLocomotionCmdCurriculum
  config:
    command_curriculum:
      enabled: True
      # progress 는 reset 이 발생한 스텝마다 degree 만큼 증감, [0,1] 클립.
      # 4096 envs 에선 거의 매 스텝 reset 이 있어 ~24 call/iter → 0.00002 면 건강한 학습 기준 ~2k iter 에 full range
      degree: 0.00002
      level_up_threshold: 400    # average_episode_length(step) 이 이보다 크면 확장
      level_down_threshold: 200  # 이보다 작으면 축소
      # tracking 게이트: walk 커맨드 env 의 tracking_lin_vel 원값(exp, [0,1]) EMA 가
      # 이 값을 넘어야만 level-up. 서있기(생존)만으로 range 가 확장되는 것을 차단.
      # 서있는 정책의 EMA 는 range 가 커질수록 하락 → progress ~0.3 부근에서 자연 정지.
      tracking_level_up_threshold: 0.75
      tracking_ema_alpha: 0.001  # step 당 EMA 계수 (시정수 ~1000 step ≈ 40 iter)
      initial_progress: 0.0      # resume 시 진행도를 이어서 시작할 때 지정
      initial_ranges:            # progress=0 범위; 최종 범위는 locomotion_command_ranges
        lin_vel_x: [-0.4, 0.4]
        lin_vel_y: [-0.4, 0.4]
        ang_vel_yaw: [-0.3, 0.3]
        # heading 은 명시하지 않으면 처음부터 최종 범위 사용
