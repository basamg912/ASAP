# @package _global_

defaults:
  - legged_base

# Env structure
env:
  _target_: humanoidverse.envs.locomotion.locomotion.LeggedRobotLocomotion
  config:
    max_episode_length_s: 20
    locomotion_obs_scales:
      lin_vel: 1.0
      ang_vel: 1.0
      dof_pos: 1.0
      dof_vel: 1.0
      humanoid_commands_scale: 1.0
    # 일반 loco
    locomotion_command_ranges:
      lin_vel_x: [-1.0, 1.0]
      lin_vel_y: [-0.4, 0.4]
      ang_vel_yaw: [-1.0, 1.0]
      heading: [-3.14, 3.14]
    # 리워드 설정
    # locomotion_command_ranges:
    #   lin_vel_x: [0.4, 0.6]
    #   lin_vel_y: [-0.0, 0.0]
    #   ang_vel_yaw: [-0.0, 0.0]
    #   heading: [-3.14, 3.14]

    locomotion_command_resampling_time: 10.0
    # command 리샘플 시 이 확률로 정지(standstill) 커맨드 배정 — walk/stand 둘 다 학습.
    # IsaacLab UniformVelocityCommandCfg.rel_standing_envs 와 동일한 역할이며,
    # 정지 env 의 유일한 공급원이다 (legged_gym 의 "norm 작으면 0" 로직은 제거됨).
    # 참고 IsaacLab 값: velocity_env_cfg 기본 0.02, Digit/Spot 0.1, loco-manip 0.25
    locomotion_stand_still_prob: 0.1

    termination:
      terminate_by_contact: False # problematic in isaacgym when g1+terrain
      # terminate_by_lin_vel: False
      # terminate_by_ang_vel: False
      terminate_by_gravity: True
      terminate_by_low_height: False

    termination_scales:
      termination_min_base_height : 0.3
      # termination_max_base_vel : 10.0
      # termination_max_base_ang_vel : 5.0
      termination_gravity_x : 0.8
      termination_gravity_y : 0.8



# Globally accessible parameters
log_task_name: locomotion

eval_overrides:
  env:
    config:
      max_episode_length_s: 100000
