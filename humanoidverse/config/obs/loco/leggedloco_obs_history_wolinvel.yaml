# @package _global_

# Be careful when using _raw, history
obs:
  obs_dict:
    actor_obs: [
      short_history
    ]

    critic_obs: [
      critic_history
    ]

  # define those coumpounds in obs_dict, for example, you can define different long/short history with different length
  obs_auxiliary:
    short_history: {
      base_ang_vel: 5,
      projected_gravity: 5,
      dof_pos: 5,
      dof_vel: 5,
      actions: 5,
      command_lin_vel: 5,
      command_ang_vel: 5,
      command_stand: 5,
    }
    critic_history: {
      base_lin_vel: 5,
      base_ang_vel: 5,
      projected_gravity: 5,
      dof_pos: 5,
      dof_vel: 5,
      actions: 5,
      command_lin_vel: 5,
      command_ang_vel: 5,
      command_stand: 5,
    }

  history_include_current: True
  history_fill_on_reset: True
  history_oldest_first: True

  obs_scales: {
    base_lin_vel: 2.0,
    base_ang_vel: 0.25,
    projected_gravity: 1.0,
    command_lin_vel: 1.0,
    command_ang_vel: 1.0,
    command_stand: 1.0,
    dof_pos: 1.0,
    dof_vel: 0.05,
    short_history: 1.0,
    critic_history: 1.0,
    actions: 1.0,
  }
  add_noise_currculum: False
  noise_initial_value: 0.05
  noise_value_max: 1.00
  noise_value_min: 0.00001
  # (구 키 soft_dof_pos_curriculum_* 에서 이름 정리. 구 키도 폴백으로 계속 동작한다)
  noise_curriculum_degree: 0.00001
  noise_curriculum_level_down_threshold: 100
  noise_curriculum_level_up_threshold: 900

  # 노이즈는 obs_scales 를 곱하기 전 '물리 단위' 로 준다
  # (IsaacLab ObservationManager 순서: func → noise → scale).
  #
  # 값 형식 — IsaacLab isaaclab.utils.noise 의 NoiseCfg 3종을 대응한다:
  #   0.05                      → UniformNoiseCfg(n_min=-0.05, n_max=0.05)  [스칼라 축약]
  #   {n_min: -0.1, n_max: 0.1} → UniformNoiseCfg  (비대칭 가능 = 센서 바이어스)
  #   {mean: 0.0, std: 0.05}    → GaussianNoiseCfg
  #   {bias: 0.02}              → ConstantNoiseCfg
  #   각 dict 에 operation: add(기본)|scale|abs 지정 가능
  #
  # IsaacLab velocity_env_cfg.py PolicyCfg 참고값 (활성화 시 출발점):
  #   base_lin_vel Unoise(±0.1) / base_ang_vel Unoise(±0.2)
  #   projected_gravity Unoise(±0.05) / joint_pos Unoise(±0.01) / joint_vel Unoise(±1.5)
  # command_* 와 actions 는 IsaacLab 에서 노이즈를 주지 않는다 — 센서값이 아니라
  # 내부에서 알고 있는 값이라 노이즈가 물리적 의미가 없다. 0.0 으로 유지할 것.
  noise_scales: {
    base_lin_vel: {n_min: -0.1, n_max: 0.1},
    base_ang_vel: {n_min: -0.2, n_max: 0.2},
    projected_gravity: {n_min: -0.05, n_max: 0.05},
    command_lin_vel: 0.0,
    command_ang_vel: 0.0,
    command_stand: 0.0,
    dof_pos: {n_min: -0.01, n_max: 0.01},
    dof_vel: {n_min: -1.5, n_max: 1.5},
    actions: 0.0,
    short_history: 0.0,
    critic_history: 0.0,
  }

  # obs_dims should use list instead of dict
  # will be converted to dict in `pre_process_config`
  obs_dims:
    - base_lin_vel: 3
    - base_ang_vel: 3
    - projected_gravity: 3
    - command_lin_vel: 2
    - command_ang_vel: 1
    - command_stand: 1
    - dof_pos: ${robot.dof_obs_size}
    - dof_vel: ${robot.dof_obs_size}
    - actions: ${robot.dof_obs_size}
