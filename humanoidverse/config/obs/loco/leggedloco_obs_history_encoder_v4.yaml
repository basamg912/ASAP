# @package _global_
# humanoidverse/config/obs/loco/leggedloco_obs_history_encoder_v4.yaml
# leggedloco_obs_history_encoder.yaml 의 additive 후속 (기존 파일은 수정하지 않는다).
#
# 차이점: recon_target 그룹을 teacher_obs 로 대체한다.
#   teacher_obs = privileged 정보 + o_t proprio
#     privileged : base_lin_vel(3), base_pos_z(1), feet_contact_force(6)
#     o_t proprio: base_ang_vel(3), projected_gravity(3), dof_pos, dof_vel
#
# 왜 privileged 를 넣는가:
#   V4 critic 모드에서 teacher latent z = phi(teacher_obs_t) 가 main critic 입력에 붙는다.
#   teacher_obs 가 critic_obs 의 부분집합이면 critic 은 z 를 무시해도 손해가 없어
#   phi 로 가는 gradient 압력이 0 이 된다. base_pos_z / feet_contact_force 는 critic_obs 에
#   없는 항목이므로, z 가 실제로 value 예측을 개선해야만 critic loss 가 줄어든다.
#   (base_lin_vel 은 critic_obs 에 이미 있어 그 자체로는 정보 이득이 없지만,
#    student 가 history 로 추정해야 하는 핵심량이라 타깃 latent 에는 포함한다.)
#
#   student 타깃은 같은 phi 로 phi(teacher_obs_{t+1}) — 즉 "한 스텝 뒤 privileged 상태"를
#   value 관련 축으로 압축한 값이다.
#
# privileged 항목은 학습 전용 경로(teacher/critic)에만 들어가므로 noise 를 주지 않는다.
# actor_obs / encoder_obs(history) 는 원본과 동일 — 배포 입력은 바뀌지 않는다.
obs:
  obs_dict:
    actor_obs: [
      base_ang_vel,
      projected_gravity,
      command_lin_vel,
      command_ang_vel,
      command_stand,
      dof_pos,
      dof_vel,
      actions
    ]
    critic_obs: [
      base_lin_vel,
      base_ang_vel,
      projected_gravity,
      command_lin_vel,
      command_ang_vel,
      command_stand,
      dof_pos,
      dof_vel,
      actions,
      short_history
    ]
    # parse_observation 에서 `get_obs_history()` 함수 실행
    # obs_dict[encoder_obs] 가 obs_auxiliary 의 history 로 채워짐
    encoder_obs: [ history ]
    # teacher encoder phi 의 입력. t 시점 값은 critic 입력용, t+1 시점 값은 student 타깃용
    # (rollout 에서 env.step 이후 next_obs_target 으로 캡처됨)
    teacher_obs: [
      base_lin_vel,
      base_pos_z,
      feet_contact_force,
      base_ang_vel,
      projected_gravity,
      dof_pos,
      dof_vel
    ]

  obs_auxiliary:
    history: {
      base_ang_vel: 5,
      projected_gravity: 5,
      dof_pos: 5,
      dof_vel: 5,
      actions: 5,
    }
    short_history: {
      base_ang_vel: 5,
      projected_gravity: 5,
      dof_pos: 5,
      dof_vel: 5,
      actions: 5,
      command_lin_vel: 5,
      command_ang_vel: 5,
      command_stand: 5,
    }

  obs_scales: {
    base_lin_vel: 2.0,
    base_ang_vel: 0.25,
    projected_gravity: 1.0,
    command_lin_vel: 1.0,
    command_ang_vel: 1.0,
    command_stand: 1.0,
    dof_pos: 1.0,
    dof_vel: 0.05,
    actions: 1.0,
    history: 1.0,
    short_history: 1.0,
    base_pos_z: 1.0,          # 약 0.8 m -> 스케일 그대로
    feet_contact_force: 0.01, # 접촉력 O(100N) -> O(1) 로
  }
  add_noise_currculum: False
  noise_initial_value: 0.05
  noise_value_max: 1.00
  noise_value_min: 0.00001
  soft_dof_pos_curriculum_degree: 0.00001
  soft_dof_pos_curriculum_level_down_threshold: 100
  soft_dof_pos_curriculum_level_up_threshold: 900
  noise_scales: {
    base_lin_vel: 0.0,
    base_ang_vel: 0.0,
    projected_gravity: 0.0,
    command_lin_vel: 0.0,
    command_ang_vel: 0.0,
    command_stand: 0.0,
    dof_pos: 0.0,
    dof_vel: 0.0,
    actions: 0.0,
    history: 0.0,
    short_history: 0.0,
    base_pos_z: 0.0,          # privileged: 학습 전용 경로라 noise 없음
    feet_contact_force: 0.0,
  }

  obs_dims:
    - base_lin_vel: 3
    - base_ang_vel: 3
    - projected_gravity: 3
    - command_lin_vel: 2
    - command_ang_vel: 1
    - command_stand: 1
    - dof_pos: ${robot.dof_obs_size}
    - dof_vel: ${robot.dof_obs_size}
    - actions: ${robot.dof_obs_size}
    - base_pos_z: 1
    - feet_contact_force: 6   # contact_bodies 2개 x 3축 (G1). 로봇 변경 시 함께 수정
