# @package _global_

domain_rand:
  # reset state
  randomize_reset_dof_pos: True
  reset_dof_pos_scale_range: [1.0, 1.0]
  randomize_reset_root_state: True
  reset_root_pose_range:
    x: [-0.5, 0.5]
    y: [-0.5, 0.5]
    z: [0.0, 0.0]
    roll: [0.0, 0.0]
    pitch: [0.0, 0.0]
    yaw: [-3.14, 3.14]
  reset_root_velocity_range:
    x: [0.0, 0.0]
    y: [0.0, 0.0]
    z: [0.0, 0.0]
    roll: [0.0, 0.0]
    pitch: [0.0, 0.0]
    yaw: [0.0, 0.0]

  # push robots
  push_robots : True
  push_interval_s : [5, 10]
  max_push_vel_xy : 0.5

  # base com
  randomize_base_com : True
  base_com_range:
    x : [-0.02, 0.02]
    y : [-0.02, 0.02]
    z : [-0.02, 0.02]

  # link mass
  randomize_link_mass : True
  link_mass_range : [0.9, 1.1]

  # pd gain
  randomize_pd_gain : True
  kp_range : [0.8, 1.2]
  kd_range : [0.7, 1.2]

  # friction
  randomize_friction : True
  friction_range : [0.8, 1.2]
  randomize_joint_friction : True
  joint_friction_scale_range : [0.8, 1.2]

  # base mass
  randomize_base_mass : False

  # rfi
  randomize_torque_rfi : True
  rfi_lim : 0.1
  randomize_rfi_lim : True
  rfi_lim_range : [0.8, 1.2]


  # control delay
  randomize_ctrl_delay : True
  ctrl_delay_step_range : [0, 1] # integer max real delay is 90ms
